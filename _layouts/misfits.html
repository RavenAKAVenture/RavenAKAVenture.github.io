<!-- This is a layout made specifically for my Misfits rules. Theres some weird stuff here, but its based on the default layout. -->
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">

<head>
    <meta http-equiv="content-type" content="text/html;charset=utf-8"/>
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <meta http-equiv="Content-Style-Type" content="text/css"/>
    <title>{% if page.title!="" %} {{ page.title }} &mdash; {%endif%}{{site.title}}</title>
    <link rel="stylesheet" href="{{site.domain}}/assets/misfitsstyle.css" />
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>
</head>
<body>
    <header>       
        <div id="navigation"><a href="{{site.url}}/obsidian/Table_Of_Contents">Table of Contents</a></div>
        <h1><i></i><a href="{{site.url}}/obsidian/Title_Page">MISFITS</a> {% if page.title!="" %}— {{page.title}}{%endif%}</i></h1> 
    </header>

    {% assign caption = page.portrait_caption %}
    {% assign linkified_content = content %}
    {% assign names = site.data.people.names | split: "," %}
    <!-- {%if page.title != ""%}<h2>{{ page.title }}</h2>{%endif%} -->
    <hr> 
    <div id="content" class="full">
        {{linkified_content}}
    </div>
    <div id="info">Return to <a href="{{site.url}}/obsidian/Title_page">title</a></div>
</body>
</html>
